{% extends "base.html" %}
{% block content %}
<section class="panel">
  <form
    class="form-card"
    hx-post="/api/enrollment/s3"
    hx-target="#s3-enrollment-result"
    hx-swap="innerHTML"
  >
    <h2>Enrollment completo via S3</h2>
    {% if s3_error %}
    <p class="empty">Não foi possível listar turmas no S3: {{ s3_error }}</p>
    {% endif %}
    <label>Turma no S3
      <select name="turma" {% if not s3_turmas %}disabled{% endif %}>
        {% for turma in s3_turmas %}
        <option value="{{ turma }}">{{ turma }}</option>
        {% endfor %}
      </select>
    </label>
    <button type="submit" {% if not s3_turmas %}disabled{% endif %}>Gerar enrollment da turma</button>
    <div id="s3-enrollment-result"></div>
  </form>
</section>
{% endblock %}
