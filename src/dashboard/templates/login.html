<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login · Proctor Dashboard</title>
  <link rel="stylesheet" href="/static/dashboard.css?v=20260924-1">
</head>
<body>
  <main class="layout login-layout">
    <section class="panel login-panel">
      <p class="eyebrow">Proctoring Station</p>
      <h1>Login</h1>
      {% if error %}
      <p class="form-error">Usuário ou senha inválidos.</p>
      {% endif %}
      <form class="form-card" method="post" action="/login">
        <input type="hidden" name="next" value="{{ next }}">
        <label>Usuário
          <input type="text" name="username" autocomplete="username" required autofocus>
        </label>
        <label>Senha
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Entrar</button>
      </form>
      <p class="empty">Cadastro fechado — sem acesso cadastrado, fale com quem administra o dashboard.</p>
    </section>
  </main>
</body>
</html>
