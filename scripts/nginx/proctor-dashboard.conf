# Template do server block do dashboard, para uma EC2 que já roda nginx por
# outro serviço (virtual host por server_name, mesmo processo nginx).
#
# Uso (na EC2, ver docs/migracao_ec2_passo_a_passo_aws.md passo 6):
#   1. Trocar SUBDOMINIO_AQUI pelo subdomínio real (ex: proctoring.dominio.com.br).
#   2. sudo cp scripts/nginx/proctor-dashboard.conf /etc/nginx/sites-available/proctor-dashboard
#      sudo ln -s /etc/nginx/sites-available/proctor-dashboard /etc/nginx/sites-enabled/proctor-dashboard
#   3. sudo nginx -t && sudo systemctl reload nginx
#   4. sudo certbot --nginx -d SUBDOMINIO_AQUI   (edita este bloco pra adicionar o 443/TLS)
#
# A app escuta só em 127.0.0.1:8010 (ver scripts/install_dashboard_service.sh)
# — este bloco é o único jeito de alcançá-la de fora da máquina.

server {
    listen 80;
    listen [::]:80;
    server_name SUBDOMINIO_AQUI;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Obrigatório para /ws/stations (WebSocket) — sem isto o upgrade
        # falha silenciosamente e o painel para de atualizar em tempo real.
        # Inofensivo nas rotas HTTP normais (não afeta requisições sem
        # header Upgrade), então fica no bloco todo em vez de só numa
        # location separada para /ws/stations.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Heartbeat das NUCs é frequente e de vida curta, mas a conexão
        # WebSocket do painel fica aberta — timeout curto derrubaria ela
        # sem motivo.
        proxy_read_timeout 60s;
    }
}
